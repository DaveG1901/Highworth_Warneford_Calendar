name: Update school calendar

on:
  schedule:
    # Twice a day at odd minutes - on-the-hour schedules are the most likely
    # to be delayed or dropped by GitHub at peak times.
    - cron: "23 6 * * *"
    - cron: "23 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.CALENDAR_PAT || github.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build calendar.ics
        run: python school_calendar.py --out calendar.ics --state state.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- calendar.ics state.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics state.json
          git commit -m "Calendar update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
